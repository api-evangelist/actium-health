aid: actium-health
name: Actium Health
description: >-
  ActiumHealth is the conversational AI platform for healthcare patient communication, operated
  as a division of Syllable Corporation. Its voice, SMS, chat and email agents automate inbound
  and outbound patient calls across appointment scheduling, prescription refill, call routing,
  referral management, patient surveys, care coordination and revenue cycle workflows for health
  systems, patient access centers, healthcare contact centers and practice groups, with more than
  70 million calls reported handled. The agents integrate with Epic, Cerner and Meditech EHRs
  through those vendors' APIs, and the platform is marketed as built to SOC 2, HITRUST and HIPAA
  standards. ActiumHealth consumes EHR APIs rather than publishing one and runs no developer
  program on actiumhealth.com; the underlying agentic platform API, SDKs, CLI, MCP server and
  documentation are published by its parent at syllable.ai and catalogued here as `syllable`.
